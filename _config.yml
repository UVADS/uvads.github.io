title: UVA Data Science
description: Technical guides and learning resources from the UVA School of Data Science.
url: https://uvads.github.io
baseurl: ""

# The theme is pulled from GitHub at build time rather than vendored into this
# repo, so upgrades are a one-line change here. Drop the "@vX.Y.Z" to always
# track the theme's latest release, or bump the tag to pick up a new version.
# Releases: https://github.com/just-the-docs/just-the-docs/releases
remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-include-cache # required by the theme
  - jekyll-sitemap

# ----------------------------------------------------------------------------
# Just the Docs settings
# https://just-the-docs.com/docs/configuration/
# ----------------------------------------------------------------------------

# "light", "dark", or a custom scheme
color_scheme: light

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true

back_to_top: true
back_to_top_text: "Back to top"

# Links in the upper right of every page
aux_links:
  "UVADS on GitHub": https://github.com/UVADS
aux_links_new_tab: true

nav_external_links:
  - title: UVA School of Data Science
    url: https://datascience.virginia.edu
    hide_icon: false

footer_content: "&copy; 2026 Maintained by the <a href=\"https://datascience.virginia.edu\">UVA School of Data Science</a>."

# "Edit this page on GitHub" links
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/UVADS/uvads.github.io"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
